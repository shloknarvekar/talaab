AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Talaab ("the sun drinks first"): per-pond dry-by countdowns from Sentinel-2.
  Zero-idle-cost stack: HTTP API + Lambda + S3 + DynamoDB on-demand.

Parameters:
  PlanAI:
    Type: String
    AllowedValues: ["on", "off"]
    Default: "off"
    Description: Generate plans with Bedrock (on) or serve only the deterministic template (off).
  PlanModelId:
    Type: String
    Default: us.anthropic.claude-opus-5-5
    Description: Bedrock inference profile used by the plan agent.

Globals:
  Function:
    Runtime: python3.12
    Tracing: Active  # AWS X-Ray: every invocation traced (free tier: 100,000 traces/month)
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Tags:
      project: talaab

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Cost guard: cap traffic so nobody can run up the bill; /plan (can trigger Bedrock) is tighter.
      DefaultRouteSettings:
        ThrottlingRateLimit: 20
        ThrottlingBurstLimit: 40
      RouteSettings:
        "POST /plan":
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5
      CorsConfiguration:
        AllowOrigins:  # browsers may call the API only from our site and local development
          - https://main.duvnkrxj02sz1.amplifyapp.com
          - http://localhost:5173
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]

  # Pipeline outputs: data/{region}/index.json, data/{region}/asof/{date}.json, crops, cached plans.
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: project
          Value: talaab

  # Latest countdown + history per pond (pk = regionId, sk = pondId). On-demand: $0 when idle.
  PondsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: regionId
          AttributeType: S
        - AttributeName: pondId
          AttributeType: S
      KeySchema:
        - AttributeName: regionId
          KeyType: HASH
        - AttributeName: pondId
          KeyType: RANGE
      Tags:
        - Key: project
          Value: talaab

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      CodeUri: ./
      Handler: api.handler.lambda_handler
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          PONDS_TABLE: !Ref PondsTable
          DEFAULT_REGION: latur-2024
          PLAN_AI: !Ref PlanAI
          PLAN_WORKER: !Ref PlanWorkerFunction
      Policies:
        - S3CrudPolicy:  # reads snapshots, writes plan status markers
            BucketName: !Ref DataBucket
        - DynamoDBReadPolicy:
            TableName: !Ref PondsTable
        - LambdaInvokePolicy:
            FunctionName: !Ref PlanWorkerFunction
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Events:
        ListRegions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /regions
            Method: GET
        ListPonds:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ponds
            Method: GET
        GetPond:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ponds/{id}
            Method: GET
        Plan:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /plan
            Method: POST
        Backtest:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /backtest
            Method: GET
        Alerts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /alerts
            Method: GET
        Imagery:  # district outlines/index (JSON) and thumbnails (302 to a signed S3 link)
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /imagery/{proxy+}
            Method: GET

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: 14

  StrandsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: Strands Agents SDK (built by backend/scripts/build_layer.py)
      ContentUri: ../.build/strands-layer.zip
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]

  # Writes the AI plan in the background (API Gateway caps requests at 30 s).
  PlanWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-plan-worker"
      CodeUri: ./
      Handler: agent.worker.lambda_handler
      Timeout: 300
      MemorySize: 512
      Layers: [!Ref StrandsLayer]
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          BEDROCK_MODEL_ID: !Ref PlanModelId
      EventInvokeConfig:
        MaximumRetryAttempts: 0  # never pay for an automatic second Bedrock attempt
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${PlanModelId}"
                - "arn:aws:bedrock:*::foundation-model/anthropic.*"
      LoggingConfig:
        LogGroup: !Ref PlanWorkerLogGroup

  PlanWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-plan-worker"
      RetentionInDays: 14

  # Critical-pond alerts. Subscribers are added outside the template (emails stay out of the public repo):
  #   aws sns subscribe --topic-arn <AlertTopicArn> --protocol email --notification-endpoint you@example.org
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alerts"
      DisplayName: Talaab alerts
      Tags:
        - Key: project
          Value: talaab

  # Every 5 days (one new Sentinel-2 pass): measurements.json -> snapshots + DynamoDB, live weather.
  RecomputeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-recompute"
      CodeUri: ./
      Handler: jobs.recompute.lambda_handler
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          PONDS_TABLE: !Ref PondsTable
          ALERT_TOPIC_ARN: !Ref AlertTopic
          SITE_URL: https://main.duvnkrxj02sz1.amplifyapp.com
      EventInvokeConfig:
        MaximumRetryAttempts: 1
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref PondsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertTopic.TopicName
      LoggingConfig:
        LogGroup: !Ref RecomputeLogGroup
      Events:
        Every5Days:
          Type: ScheduleV2
          Properties:
            Name: !Sub "${AWS::StackName}-every-5-days"
            Description: Recompute pond countdowns after each Sentinel-2 revisit
            # every 5 days on fixed dates (1st, 6th, 11th ... of each month), 06:30 IST, after the district run
            ScheduleExpression: cron(30 6 1/5 * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata
            State: ENABLED

  RecomputeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-recompute"
      RetentionInDays: 14

  # One screen for the demo video: traffic, errors, job runs, latest recompute log lines (free: 3 dashboards).
  OpsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-ops"
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {"type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
               "properties": {"markdown": "## Talaab: the sun drinks first. Per-pond dry-by countdowns for drought districts. Satellite: Sentinel-2 (Copernicus, AWS Open Data). Weather: Open-Meteo."}},
              {"type": "metric", "x": 0, "y": 2, "width": 12, "height": 6,
               "properties": {"title": "API requests and errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                 "metrics": [["AWS/ApiGateway", "Count", "ApiId", "${HttpApi}"], [".", "4xx", ".", "."], [".", "5xx", ".", "."]]}},
              {"type": "metric", "x": 12, "y": 2, "width": 12, "height": 6,
               "properties": {"title": "Lambda runs", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                 "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${Api}"], ["...", "${Recompute}"], ["...", "${Worker}"]]}},
              {"type": "metric", "x": 0, "y": 8, "width": 12, "height": 6,
               "properties": {"title": "Lambda errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                 "metrics": [["AWS/Lambda", "Errors", "FunctionName", "${Api}"], ["...", "${Recompute}"], ["...", "${Worker}"]]}},
              {"type": "metric", "x": 12, "y": 8, "width": 12, "height": 6,
               "properties": {"title": "Lambda duration (ms, p95)", "region": "${AWS::Region}", "stat": "p95", "period": 300,
                 "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${Api}"], ["...", "${Recompute}"], ["...", "${Worker}"]]}},
              {"type": "log", "x": 0, "y": 14, "width": 24, "height": 8,
               "properties": {"title": "Every-5-days recompute: latest runs", "region": "${AWS::Region}", "view": "table",
                 "query": "SOURCE '/aws/lambda/${Recompute}' | fields @timestamp, region, mode, latestAsOf, ponds, flagged.0, sunShareMm, skipped, error | filter msg = 'recompute' | sort @timestamp desc | limit 20"}},
              {"type": "alarm", "x": 0, "y": 36, "width": 24, "height": 3,
               "properties": {"title": "Ops alarms (email via SNS talaab-ops)", "alarms": ["${A1}", "${A2}", "${A3}", "${A4}", "${A5}", "${A6}"]}},
              {"type": "text", "x": 0, "y": 22, "width": 24, "height": 1,
               "properties": {"markdown": "### Whole district from satellite: EventBridge Scheduler → Step Functions `${StateMachineName}` → one Lambda per 0.15° grid cell (42 for Latur) → merge → recompute → SNS"}},
              {"type": "metric", "x": 0, "y": 23, "width": 8, "height": 6,
               "properties": {"title": "District runs (Step Functions)", "region": "${AWS::Region}", "stat": "Sum", "period": 3600,
                 "metrics": [["AWS/States", "ExecutionsStarted", "StateMachineArn", "${StateMachine}"], [".", "ExecutionsSucceeded", ".", "."], [".", "ExecutionsFailed", ".", "."]]}},
              {"type": "metric", "x": 8, "y": 23, "width": 8, "height": 6,
               "properties": {"title": "Grid cells measured in parallel (Lambda)", "region": "${AWS::Region}", "period": 60,
                 "metrics": [["AWS/Lambda", "ConcurrentExecutions", "FunctionName", "${Cell}", {"stat": "Maximum", "label": "cells at once"}], [".", "Invocations", ".", ".", {"stat": "Sum", "label": "cells run"}]]}},
              {"type": "metric", "x": 16, "y": 23, "width": 8, "height": 6,
               "properties": {"title": "Seconds per grid cell (p95) and errors", "region": "${AWS::Region}", "period": 300,
                 "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${Cell}", {"stat": "p95", "label": "cell duration ms"}], [".", "Errors", ".", ".", {"stat": "Sum", "yAxis": "right"}]]}},
              {"type": "log", "x": 0, "y": 29, "width": 12, "height": 7,
               "properties": {"title": "District runs: ponds found per run", "region": "${AWS::Region}", "view": "table",
                 "query": "SOURCE '/aws/lambda/${Merge}' | fields @timestamp, region, cells, pondsKept, pondsExcluded, passes, cellSeconds, mergeSeconds | filter msg = 'district merged' | sort @timestamp desc | limit 20"}},
              {"type": "log", "x": 12, "y": 29, "width": 12, "height": 7,
               "properties": {"title": "Alert emails sent (Amazon SNS)", "region": "${AWS::Region}", "view": "table",
                 "query": "SOURCE '/aws/lambda/${Recompute}' | fields @timestamp, region, count, delivered, subject | filter msg = 'alerts' | sort @timestamp desc | limit 20"}}
            ]
          }
        - Api: !Ref ApiFunction
          Recompute: !Ref RecomputeFunction
          Worker: !Ref PlanWorkerFunction
          Cell: !Ref CellFunction
          Merge: !Ref MergeFunction
          StateMachine: !Ref DistrictStateMachine
          StateMachineName: !GetAtt DistrictStateMachine.Name
          A1: !GetAtt MarathwadaRunFailedAlarm.Arn
          A2: !GetAtt DistrictRunFailedAlarm.Arn
          A3: !GetAtt CellErrorsAlarm.Arn
          A4: !GetAtt RecomputeErrorsAlarm.Arn
          A5: !GetAtt ApiErrorsAlarm.Arn
          A6: !GetAtt Api5xxAlarm.Arn

  # ---- District scale: the satellite pipeline itself on AWS (one Lambda per grid cell, in parallel) ----
  PipelineLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: rasterio (GDAL), numpy, scipy.ndimage, pystac-client (built by backend/scripts/build_layer.py --name pipeline-layer)
      ContentUri: ../.build/pipeline-layer.zip
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]

  CellFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-pipeline-cell"
      CodeUri: ../.build/pipeline-fn
      Handler: cell_handler.lambda_handler
      Timeout: 900
      MemorySize: 2048
      Layers: [!Ref PipelineLayer]
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
      LoggingConfig:
        LogGroup: !Ref CellLogGroup

  CellLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-pipeline-cell"
      RetentionInDays: 14

  MergeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-pipeline-merge"
      CodeUri: ../.build/pipeline-fn
      Handler: merge_handler.lambda_handler
      Timeout: 900  # also promotes district imagery (thousands of S3 copies)
      MemorySize: 1024
      Layers: [!Ref PipelineLayer]
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          RECOMPUTE_FUNCTION: !Ref RecomputeFunction
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - LambdaInvokePolicy:
            FunctionName: !Ref RecomputeFunction
      LoggingConfig:
        LogGroup: !Ref MergeLogGroup

  MergeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-pipeline-merge"
      RetentionInDays: 14

  GridFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-pipeline-grid"
      CodeUri: ../.build/pipeline-fn
      Handler: grid_handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      LoggingConfig:
        LogGroup: !Ref GridLogGroup

  GridLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-pipeline-grid"
      RetentionInDays: 14

  # Grid -> Map over every cell (6 at a time, under the account's 10-Lambda limit) -> merge.
  DistrictStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-district"
      Type: STANDARD
      Tracing:
        Enabled: true
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref GridFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CellFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref MergeFunction
      DefinitionSubstitutions:
        GridArn: !GetAtt GridFunction.Arn
        CellArn: !GetAtt CellFunction.Arn
        MergeArn: !GetAtt MergeFunction.Arn
      Definition:
        Comment: "Talaab: process a whole district from Sentinel-2, one Lambda per grid cell"
        StartAt: Grid
        States:
          Grid:
            Type: Task
            Resource: "${GridArn}"
            ResultPath: "$.grid"
            Next: ProcessCells
          ProcessCells:
            Type: Map
            ItemsPath: "$.grid.cells"
            # 6 cells at a time: the account allows 10 concurrent Lambdas, and the website's API, the merge and
            # recompute must still get one during a scheduled run (at 8 the API was throttled -> HTTP 503).
            MaxConcurrency: 6
            ItemSelector:
              cell.$: "$$.Map.Item.Value"
              region.$: "$.region"
              start.$: "$.start"
              end.$: "$.end"
              referenceDate.$: "$.referenceDate"
              maxCloud.$: "$.maxCloud"
            ItemProcessor:
              ProcessorConfig:
                Mode: INLINE
              StartAt: ProcessCell
              States:
                ProcessCell:
                  Type: Task
                  Resource: "${CellArn}"
                  Retry:
                    - ErrorEquals: ["States.ALL"]
                      IntervalSeconds: 20
                      MaxAttempts: 2
                      BackoffRate: 2
                  End: true
            ResultPath: "$.cellResults"
            Next: Merge
          Merge:
            Type: Task
            Resource: "${MergeArn}"
            Parameters:
              region.$: "$.region"
              name.$: "$.name"
              boundary.$: "$.boundary"
              referenceDate.$: "$.referenceDate"
            End: true

  # All 8 Marathwada districts, one after another (the account allows 10 concurrent Lambdas and each district
  # run already uses 8): one child execution of the district workflow per district. A failed district is
  # recorded and the others still run.
  MarathwadaStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-marathwada"
      Type: STANDARD
      Tracing:
        Enabled: true
      Policies:
        - Statement:
            - Effect: Allow
              Action: ["states:StartExecution"]
              Resource: !Ref DistrictStateMachine
            - Effect: Allow
              Action: ["states:DescribeExecution", "states:StopExecution"]
              Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}-district:*"
            - Effect: Allow
              Action: ["events:PutTargets", "events:PutRule", "events:DescribeRule"]
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForStepFunctionsExecutionRule"
      DefinitionSubstitutions:
        DistrictArn: !Ref DistrictStateMachine
      Definition:
        Comment: "Talaab: every Marathwada district, one district workflow after another"
        StartAt: Districts
        States:
          Districts:
            Type: Map
            ItemsPath: "$.districts"
            MaxConcurrency: 1
            ItemSelector:
              region.$: "$$.Map.Item.Value.region"
              name.$: "$$.Map.Item.Value.name"
              boundary.$: "$$.Map.Item.Value.boundary"
              start.$: "$.start"
              end.$: "$.end"
              referenceDate.$: "$.referenceDate"
              maxCloud.$: "$.maxCloud"
            ItemProcessor:
              ProcessorConfig:
                Mode: INLINE
              StartAt: RunDistrict
              States:
                RunDistrict:
                  Type: Task
                  Resource: "arn:aws:states:::states:startExecution.sync:2"
                  Parameters:
                    StateMachineArn: "${DistrictArn}"
                    Input.$: "$"
                  ResultSelector:
                    region.$: "$.Input.region"
                    status.$: "$.Status"
                    run.$: "$.Output"
                  Catch:
                    - ErrorEquals: ["States.ALL"]
                      ResultPath: "$.error"
                      Next: DistrictFailed
                  End: true
                DistrictFailed:
                  Type: Pass
                  Parameters:
                    region.$: "$.region"
                    status: FAILED
                    error.$: "$.error"
                  End: true
            ResultPath: "$.results"
            End: true
      Events:
        # The live Marathwada districts: re-measured from Sentinel-2 every 5 days (one revisit). end "today"
        # is resolved by each cell; each district's merge then starts recompute, which emails new alerts.
        LiveMarathwada:
          Type: ScheduleV2
          Properties:
            Name: !Sub "${AWS::StackName}-live-marathwada"
            # every 5 days on fixed dates (1st, 6th, 11th ... of each month), 06:00 IST
            ScheduleExpression: cron(0 6 1/5 * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata
            Input: '{"start": "2026-09-01", "end": "today", "referenceDate": "2026-09-27", "maxCloud": 45, "districts": [{"region": "latur-district-2026", "name": "Latur district (live, 2026)", "boundary": "latur-district"}, {"region": "beed-district-2026", "name": "Beed district (live, 2026)", "boundary": "beed-district"}, {"region": "dharashiv-district-2026", "name": "Dharashiv district (live, 2026)", "boundary": "dharashiv-district"}, {"region": "nanded-district-2026", "name": "Nanded district (live, 2026)", "boundary": "nanded-district"}, {"region": "parbhani-district-2026", "name": "Parbhani district (live, 2026)", "boundary": "parbhani-district"}, {"region": "hingoli-district-2026", "name": "Hingoli district (live, 2026)", "boundary": "hingoli-district"}, {"region": "jalna-district-2026", "name": "Jalna district (live, 2026)", "boundary": "jalna-district"}, {"region": "sambhajinagar-district-2026", "name": "Chhatrapati Sambhajinagar district (live, 2026)", "boundary": "sambhajinagar-district"}]}'

  # ---- Ops: technical alarms go to their own topic (pond alerts stay on talaab-alerts). 6 alarms (10 are free).
  # Subscribe with: aws sns subscribe --topic-arn <OpsTopicArn> --protocol email --notification-endpoint <you>
  OpsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-ops"
      DisplayName: Talaab ops
      Tags:
        - Key: project
          Value: talaab

  DistrictRunFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-district-run-failed"
      AlarmDescription: "Talaab ops: district run failed"
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref DistrictStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  MarathwadaRunFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-marathwada-run-failed"
      AlarmDescription: "Talaab ops: marathwada run failed"
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref MarathwadaStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-lambda-errors"
      AlarmDescription: "Talaab ops: api lambda errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  RecomputeErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-recompute-lambda-errors"
      AlarmDescription: "Talaab ops: recompute lambda errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RecomputeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  CellErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-pipeline-cell-errors"
      AlarmDescription: "Talaab ops: pipeline cell errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CellFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-5xx"
      AlarmDescription: "Talaab ops: api 5xx"
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  # ---- Amazon Location Service basemaps for the web map (dark vector style + satellite raster). The key is public
  # in the browser, so it only works from our site and localhost, only for map tiles, and expires after judging.
  # Cost: $0.04 per 1,000 tiles (a judge's session is a few hundred tiles).
  MapsApiKey:
    Type: AWS::Location::APIKey
    Properties:
      KeyName: !Sub "${AWS::StackName}-web-maps"
      Description: Talaab web map basemaps (dark style, satellite)
      ExpireTime: "2026-11-30T00:00:00Z"
      Restrictions:
        AllowActions: ["geo-maps:GetTile", "geo-maps:GetStaticMap"]
        AllowResources: [!Sub "arn:aws:geo-maps:${AWS::Region}::provider/default"]
        AllowReferers: ["https://main.duvnkrxj02sz1.amplifyapp.com/*", "http://localhost:5173/*"]

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-hello"
      CodeUri: hello/
      Handler: app.lambda_handler
      LoggingConfig:
        LogGroup: !Ref HelloLogGroup
      Events:
        Hello:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /hello
            Method: GET

  HelloLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-hello"
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Base URL of the Talaab HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  HelloUrl:
    Description: Smoke-test endpoint
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/hello"
  DataBucketName:
    Description: S3 bucket for pipeline outputs (upload under data/)
    Value: !Ref DataBucket
  PondsTableName:
    Description: DynamoDB table for per-pond state
    Value: !Ref PondsTable
  DashboardUrl:
    Description: CloudWatch dashboard (show this in the video)
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${AWS::StackName}-ops"
  AlertTopicArn:
    Description: SNS topic for critical-pond alerts (subscribe an email with aws sns subscribe)
    Value: !Ref AlertTopic
  DistrictStateMachineArn:
    Description: Step Functions workflow that processes a whole district (start with scripts/run_district.py)
    Value: !Ref DistrictStateMachine
  OpsTopicArn:
    Description: SNS topic for technical alarms (failed runs, Lambda errors, API 5xx)
    Value: !Ref OpsTopic
  MapsApiKeyName:
    Description: Amazon Location API key for the web basemaps (read the value with aws location describe-key)
    Value: !Ref MapsApiKey
  MarathwadaStateMachineArn:
    Description: Runs the district workflow for every Marathwada district in turn (scripts/run_district.py --marathwada)
    Value: !Ref MarathwadaStateMachine
  RecomputeFunctionName:
    Description: Recompute job (invoked by the 5-day schedule and scripts/upload_measurements.py)
    Value: !Ref RecomputeFunction
