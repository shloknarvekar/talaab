AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Talaab ("the sun drinks first"): per-pond dry-by countdowns from Sentinel-2.
  Zero-idle-cost stack: HTTP API + Lambda + S3 + DynamoDB on-demand.

Parameters:
  PlanAI:
    Type: String
    AllowedValues: ["on", "off"]
    Default: "off"
    Description: Generate plans with Bedrock (on) or serve only the deterministic template (off).
  PlanModelId:
    Type: String
    Default: us.anthropic.claude-opus-5-5
    Description: Bedrock inference profile used by the plan agent.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Tags:
      project: talaab

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]

  # Pipeline outputs: data/{region}/index.json, data/{region}/asof/{date}.json, crops, cached plans.
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: project
          Value: talaab

  # Latest countdown + history per pond (pk = regionId, sk = pondId). On-demand: $0 when idle.
  PondsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: regionId
          AttributeType: S
        - AttributeName: pondId
          AttributeType: S
      KeySchema:
        - AttributeName: regionId
          KeyType: HASH
        - AttributeName: pondId
          KeyType: RANGE
      Tags:
        - Key: project
          Value: talaab

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      CodeUri: ./
      Handler: api.handler.lambda_handler
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          PONDS_TABLE: !Ref PondsTable
          DEFAULT_REGION: latur-2024
          PLAN_AI: !Ref PlanAI
          PLAN_WORKER: !Ref PlanWorkerFunction
      Policies:
        - S3CrudPolicy:  # reads snapshots, writes plan status markers
            BucketName: !Ref DataBucket
        - DynamoDBReadPolicy:
            TableName: !Ref PondsTable
        - LambdaInvokePolicy:
            FunctionName: !Ref PlanWorkerFunction
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Events:
        ListPonds:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ponds
            Method: GET
        GetPond:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ponds/{id}
            Method: GET
        Plan:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /plan
            Method: POST

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: 14

  StrandsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: Strands Agents SDK (built by backend/scripts/build_layer.py)
      ContentUri: ../.build/strands-layer.zip
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]

  # Writes the AI plan in the background (API Gateway caps requests at 30 s).
  PlanWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-plan-worker"
      CodeUri: ./
      Handler: agent.worker.lambda_handler
      Timeout: 300
      MemorySize: 512
      Layers: [!Ref StrandsLayer]
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          BEDROCK_MODEL_ID: !Ref PlanModelId
      EventInvokeConfig:
        MaximumRetryAttempts: 0  # never pay for an automatic second Bedrock attempt
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${PlanModelId}"
                - "arn:aws:bedrock:*::foundation-model/anthropic.*"
      LoggingConfig:
        LogGroup: !Ref PlanWorkerLogGroup

  PlanWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-plan-worker"
      RetentionInDays: 14

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-hello"
      CodeUri: hello/
      Handler: app.lambda_handler
      LoggingConfig:
        LogGroup: !Ref HelloLogGroup
      Events:
        Hello:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /hello
            Method: GET

  HelloLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-hello"
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Base URL of the Talaab HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  HelloUrl:
    Description: Smoke-test endpoint
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/hello"
  DataBucketName:
    Description: S3 bucket for pipeline outputs (upload under data/)
    Value: !Ref DataBucket
  PondsTableName:
    Description: DynamoDB table for per-pond state
    Value: !Ref PondsTable
