# AWS Amplify Hosting build for the web map (monorepo: the app lives in web/).
# The app defaults to the live API; set VITE_TALAAB_API_URL in the Amplify console only to override it.
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
