# Talaab CI: every push and pull request to main runs all tests, checks the committed data against the
# contract, lints the AWS template and builds the web app. No AWS credentials are used or needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_DEFAULT_REGION: us-west-2  # boto3 clients are created lazily; no calls are made in tests
  PYTHONUTF8: "1"

jobs:
  backend:
    name: Backend tests (countdown, flags, alerts, plan, API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/scripts/requirements.txt
            backend/agent/requirements.txt
      - name: Install
        run: pip install -r backend/requirements-dev.txt -r backend/scripts/requirements.txt -r backend/agent/requirements.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  pipeline:
    name: Pipeline tests (water, ponds, cleanup, district grid, imagery)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install
        run: pip install -r pipeline/requirements.txt
      - name: pytest
        run: python -m pytest -q pipeline/tests

  data-and-infra:
    name: Committed data matches the contract; SAM template lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install cfn-lint
      - name: Check every data/<region>/measurements.json
        run: |
          status=0
          for f in data/*/measurements.json; do
            echo "::group::$f"
            python backend/scripts/check_measurements.py "$f" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: cfn-lint backend/template.yaml
        run: cfn-lint backend/template.yaml

  web:
    name: Web app builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: web
        run: npm run build
